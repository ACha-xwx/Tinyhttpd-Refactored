          <script>
              (function () {
                let lastTime = performance.now();
                let frame = 0;
                const fpsText = document.getElementById('fps-text');
                const fpsDot = document.getElementById('fps-dot');
                function updateFPS() {
                  const now = performance.now();
                  frame++;
                  if (now - lastTime >= 1000) {
                    const currentFps = Math.round((frame * 1000) / (now - lastTime));
                    if (fpsText) fpsText.innerText = `FPS: ${currentFps}`;
                    if (currentFps >= 55) {
                      if (fpsText) fpsText.style.color = '#10b981';
                      if (fpsDot) fpsDot.style.color = '#10b981';
                    } else if (currentFps >= 30) {
                      if (fpsText) fpsText.style.color = '#f59e0b';
                      if (fpsDot) fpsDot.style.color = '#f59e0b';
                    } else {
                      if (fpsText) fpsText.style.color = '#ef4444';
                      if (fpsDot) fpsDot.style.color = '#ef4444';
                    }
                    frame = 0;
                    lastTime = now;
                  }
                  requestAnimationFrame(updateFPS);
                }
                updateFPS();
              })();
            function toggleDashboard() {
              const dashboard = document.getElementById('dashboard-container');
              const icon = document.getElementById('toggle-icon');
              if (dashboard.classList.contains('dashboard-hidden')) {
                dashboard.classList.remove('dashboard-hidden');
                icon.innerHTML = '✖';
                icon.style.transform = 'rotate(90deg)';
              } else {
                dashboard.classList.add('dashboard-hidden');
                icon.innerHTML = '🎵';
                icon.style.transform = 'rotate(0deg)';
              }
            }
            document.getElementById('dashboard-container').classList.add('dashboard-hidden');
          </script>
          <canvas id="fireworks"
            style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:99999"></canvas>

          <script>
            var OriginTitle = document.title;
            var titleTime;
            document.addEventListener('visibilitychange', function () {
              if (document.hidden) {
                document.title = '快回来呀 ヾ(≧へ≦)〃';
                clearTimeout(titleTime);
              } else {
                document.title = '欢迎光临 ヾ(≧▽≦*)o';
                titleTime = setTimeout(function () { document.title = OriginTitle; }, 1000);
              }
            });

            const canvas = document.getElementById('fireworks');
            const ctx = canvas.getContext('2d');
            let particles = [];
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();
            window.addEventListener('mousemove', (e) => {
              for (let i = 0; i < 2; i++) {
                particles.push({
                  x: e.clientX, y: e.clientY, size: Math.random() * 3 + 1,
                  spX: (Math.random() - 0.5) * 2, spY: (Math.random() - 0.5) * 2,
                  color: `hsl(${Math.random() * 360}, 50%, 50%)`, alpha: 1
                });
              }
            });
            function animate() {
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              particles.forEach((p, i) => {
                p.x += p.spX; p.y += p.spY; p.alpha -= 0.02;
                if (p.alpha <= 0) return particles.splice(i, 1);
                ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
              });
              requestAnimationFrame(animate);
            }
            animate();
          </script>
